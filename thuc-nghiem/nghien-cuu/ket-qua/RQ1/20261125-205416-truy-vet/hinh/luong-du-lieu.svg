<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title description">
  <title id="title">Luồng tái sử dụng dữ liệu bộ lọc</title>
  <desc id="description">SAVE_SEARCH lưu bộ lọc vào MySQL. LOAD_SEARCH đọc lại bản ghi. Khi xem trước, ceiling chọn nhánh, category và ceiling được ràng buộc theo nhánh. Khi xuất, state quyết định có thực thi và ceiling xuất hiện trong hai ô tham số. Sort chọn mẫu sắp xếp cố định ở cả hai thao tác.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#536575"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #172b3b; }
      .title { font-size: 43px; font-weight: 700; }
      .section { font-size: 27px; font-weight: 700; }
      .body { font-size: 22px; }
      .muted { fill: #415565; }
      .code { font-family: Consolas, 'Courier New', monospace; font-size: 22px; font-weight: bold; }
      .bound { fill: #075b4e; }
      .selection { fill: #754705; }
      .link { fill: none; stroke: #536575; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1440" height="810" fill="#f5f8fa"/>
  <text x="52" y="82" class="title">Luồng tái sử dụng dữ liệu bộ lọc</text>
  <text x="54" y="126" class="body muted">Sơ đồ thiết kế của ứng dụng MySQL</text>

  <g fill="#fff" stroke="#b7c6d1" stroke-width="1.5">
    <rect x="54" y="179" width="306" height="142" rx="12"/>
    <rect x="393" y="179" width="281" height="142" rx="12"/>
    <rect x="707" y="179" width="326" height="142" rx="12"/>
    <rect x="1066" y="179" width="320" height="142" rx="12"/>
  </g>
  <g class="link">
    <path d="M365 250 H387"/>
    <path d="M679 250 H701"/>
    <path d="M1038 250 H1060"/>
    <path d="M1226 326 V366 H538 V420"/>
    <path d="M1226 326 V366 H1210 V420"/>
  </g>
  <text x="74" y="220" class="section">Yêu cầu ghi</text>
  <text x="74" y="258" class="code">PUT /searches/:id</text>
  <text x="74" y="293" class="body muted">category, sort, ceiling</text>
  <text x="413" y="220" class="section">Lưu bộ lọc</text>
  <text x="413" y="258" class="code">SAVE_SEARCH</text>
  <text x="413" y="293" class="body bound">Ràng buộc giá trị</text>
  <text x="727" y="220" class="section">Bản ghi MySQL</text>
  <text x="727" y="258" class="code">study_searches</text>
  <text x="727" y="293" class="body muted">Ứng dụng quản lý state</text>
  <text x="1086" y="220" class="section">Đọc lại bản ghi</text>
  <text x="1086" y="258" class="code">LOAD_SEARCH</text>
  <text x="1086" y="293" class="body muted">Tra theo ID từ yêu cầu</text>

  <g fill="#fff" stroke="#b7c6d1" stroke-width="1.5">
    <rect x="54" y="426" width="785" height="239" rx="12"/>
    <rect x="872" y="426" width="514" height="239" rx="12"/>
  </g>
  <text x="76" y="469" class="section">Xem trước</text>
  <text x="894" y="469" class="section">Xuất danh mục</text>

  <text x="76" y="507" class="body selection">ceiling chọn vị trí SQL</text>
  <text x="894" y="507" class="body selection">state phải là published</text>

  <g fill="#f5f8fa">
    <rect x="76" y="529" width="349" height="111" rx="8"/>
    <rect x="438" y="529" width="379" height="111" rx="8"/>
    <rect x="894" y="529" width="470" height="111" rx="8"/>
  </g>
  <text x="94" y="558" class="body muted">Không có trần giá</text>
  <text x="94" y="590" class="code">PREVIEW_CATEGORY</text>
  <text x="94" y="623" class="body bound">category (ô 1)</text>
  <text x="456" y="558" class="body muted">Có trần giá</text>
  <text x="456" y="590" class="code">PREVIEW_BUDGET</text>
  <text x="456" y="623" class="body bound">category (ô 1), ceiling (ô 2)</text>
  <text x="912" y="558" class="body muted">Cùng mẫu lọc giá với mọi ceiling</text>
  <text x="912" y="590" class="code">EXPORT_SEARCH</text>
  <text x="912" y="623" class="body bound">category (ô 1), ceiling (ô 2 và 3)</text>

  <rect x="54" y="683" width="1332" height="50" rx="8" fill="#f8eed7"/>
  <text x="76" y="716" class="body selection">sort chọn mẫu sắp xếp cố định name hoặc price khi xem trước và khi xuất.</text>
  <text x="54" y="779" class="body bound">Giá trị ràng buộc</text>
  <text x="292" y="779" class="body selection">Chọn truy vấn hoặc điều kiện thực thi</text>
</svg>
