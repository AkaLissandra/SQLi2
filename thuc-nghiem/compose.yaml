services:
  mysql:
    image: mysql:8.0.46
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sqli_study}
      MYSQL_USER: ${MYSQL_USER:-study}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysql --host=127.0.0.1 --user="$$MYSQL_USER" --password="$$MYSQL_PASSWORD" "$$MYSQL_DATABASE" --execute="SELECT 1" >/dev/null 2>&1'
      interval: 3s
      timeout: 3s
      start_period: 20s
      retries: 20
volumes:
  mysql-data:
